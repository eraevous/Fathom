[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom-guide"
version = "0.1.0"
description = "Evidenced tabular data review and repeatable documentation"
requires-python = ">=3.12"
dependencies = ["pandas==2.2.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
stats = ["scipy>=1.14,<2"]

[project.scripts]
guide = "fathom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
