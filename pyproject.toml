[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom-guide"
version = "0.1.0"
description = "Evidenced tabular data review and repeatable documentation"
requires-python = ">=3.11"
# Ranges, not pins, so Fathom installs beside a managed notebook image (spec 029).
# CI tests both ends; requirements/ci-lock.txt keeps the reproducible middle.
dependencies = ["pandas>=2.0,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
stats = ["scipy>=1.14,<2"]
pdf = ["reportlab>=4.4,<5"]
pptx = ["python-pptx>=1.0.2,<2"]
exports = ["reportlab>=4.4,<5", "python-pptx>=1.0.2,<2"]

[project.scripts]
guide = "fathom.cli:main"

# Spec 031: the desktop window; a GUI script has no console window on Windows.
[project.gui-scripts]
fathom-app = "fathom.app:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
