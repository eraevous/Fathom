name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stats: [core, scipy, exports]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Reproducible set (spec 029): the lock file, then the package without re-resolving.
      - run: pip install -r requirements/ci-lock.txt && pip install --no-deps -e .
      - if: matrix.stats == 'scipy'
        run: pip install -e '.[stats]'
      - if: matrix.stats == 'exports'
        run: pip install -e '.[exports]'
      - run: python -m pytest -q
  # Spec 029: both ends of the supported dependency ranges, as a managed notebook image might have them.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: lowest, python: "3.11", deps: "pandas==2.0.3 PyYAML==6.0 numpy==1.26.4"}
          - {name: latest, python: "3.13", deps: ""}
    name: compat (${{ matrix.name }}, Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e '.[test]' ${{ matrix.deps }}
      - run: python -c "import pandas, yaml, sys; print(sys.version.split()[0], 'pandas', pandas.__version__, 'PyYAML', yaml.__version__)"
      - run: python -m pytest -q
